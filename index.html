<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Smart Board Pro</title>
<style>
  :root{
    --bg-0:#0a0e17;
    --bg-1:#0f1424;
    --panel:rgba(22,28,45,0.72);
    --panel-border:rgba(255,255,255,0.08);
    --cyan:#22d3ee;
    --violet:#a78bfa;
    --amber:#fbbf24;
    --text-hi:#eef2ff;
    --text-lo:#8a93b3;
    --danger:#f87171;
    --grid-line:rgba(255,255,255,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:
      radial-gradient(1200px 800px at 15% -10%, rgba(34,211,238,0.10), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(167,139,250,0.10), transparent 60%),
      var(--bg-0);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    color:var(--text-hi);
    touch-action:none;
    user-select:none;
  }
  #app{position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;}

  /* ---------- TOP BAR ---------- */
  #topbar{
    height:56px; flex:0 0 auto;
    display:flex; align-items:center; gap:10px;
    padding:0 14px;
    background:var(--panel);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--panel-border);
    z-index:50;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-weight:600; font-size:15px; letter-spacing:0.2px;
    background:linear-gradient(90deg,var(--cyan),var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-right:6px; white-space:nowrap;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,var(--cyan),var(--violet));
    box-shadow:0 0 10px var(--cyan);
    -webkit-text-fill-color:initial;
  }
  .divider{width:1px; height:26px; background:var(--panel-border); margin:0 4px;}
  .spacer{flex:1;}
  .top-btn{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--panel-border);
    color:var(--text-hi);
    padding:8px 12px; border-radius:10px;
    font-size:13px; cursor:pointer;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .top-btn:hover{background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.16);}
  .top-btn:active{transform:scale(0.96);}
  .top-btn.primary{
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    border:none; color:#081018; font-weight:600;
    box-shadow:0 0 18px rgba(167,139,250,0.35);
  }
  .top-btn.primary:hover{filter:brightness(1.08);}
  .top-btn:disabled{opacity:0.35; cursor:not-allowed; pointer-events:none;}
  #pageLabel{font-size:13px; color:var(--text-lo); min-width:70px; text-align:center;}

  /* ---------- MAIN LAYOUT ---------- */
  #main{flex:1; display:flex; position:relative; overflow:hidden;}

  /* ---------- LEFT TOOL RAIL ---------- */
  #toolrail{
    width:64px; flex:0 0 auto;
    background:var(--panel);
    backdrop-filter:blur(18px);
    border-right:1px solid var(--panel-border);
    display:flex; flex-direction:column; align-items:center;
    padding:12px 0; gap:6px; overflow-y:auto; z-index:40;
  }
  .tool-btn{
    width:46px; height:46px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid transparent;
    color:var(--text-lo); cursor:pointer; font-size:20px;
    position:relative; transition:all .15s;
  }
  .tool-btn:hover{background:rgba(255,255,255,0.06); color:var(--text-hi);}
  .tool-btn.active{
    background:linear-gradient(135deg,rgba(34,211,238,0.18),rgba(167,139,250,0.18));
    border-color:rgba(167,139,250,0.4);
    color:var(--cyan);
    box-shadow:0 0 14px rgba(34,211,238,0.25) inset;
  }
  .rail-sep{width:34px; height:1px; background:var(--panel-border); margin:4px 0;}

  /* ---------- CANVAS AREA ---------- */
  #canvasWrap{flex:1; position:relative; overflow:hidden; background:var(--bg-1);}
  canvas{position:absolute; top:0; left:0; touch-action:none;}
  #bgCanvas{z-index:1;}
  #mainCanvas{z-index:2;}
  #overlayCanvas{z-index:3;}

  /* ---------- RIGHT PROPERTIES PANEL ---------- */
  #propPanel{
    width:220px; flex:0 0 auto;
    background:var(--panel);
    backdrop-filter:blur(18px);
    border-left:1px solid var(--panel-border);
    padding:16px 14px; overflow-y:auto;
    transition:margin-right .2s ease;
    z-index:40;
  }
  #propPanel.collapsed{margin-right:-220px;}
  .prop-group{margin-bottom:20px;}
  .prop-label{font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-lo); margin-bottom:8px; display:block;}
  .swatches{display:flex; flex-wrap:wrap; gap:8px;}
  .swatch{
    width:26px; height:26px; border-radius:8px; cursor:pointer;
    border:2px solid transparent; transition:transform .1s, border-color .1s;
  }
  .swatch:hover{transform:scale(1.1);}
  .swatch.active{border-color:#fff; box-shadow:0 0 8px rgba(255,255,255,0.5);}
  input[type=range]{width:100%; accent-color:var(--cyan);}
  .size-preview{
    display:flex; align-items:center; justify-content:center;
    height:40px; margin-top:6px;
  }
  #sizeDot{border-radius:50%; background:var(--text-hi);}
  select, input[type=color]{
    width:100%; background:rgba(255,255,255,0.06); color:var(--text-hi);
    border:1px solid var(--panel-border); border-radius:8px; padding:7px; font-size:12px;
  }
  .toggle-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .switch{
    width:38px; height:22px; border-radius:20px; background:rgba(255,255,255,0.1);
    position:relative; cursor:pointer; transition:background .2s; flex:0 0 auto;
  }
  .switch.on{background:linear-gradient(90deg,var(--cyan),var(--violet));}
  .switch::after{
    content:''; position:absolute; top:2px; left:2px; width:18px; height:18px;
    border-radius:50%; background:#fff; transition:left .2s;
  }
  .switch.on::after{left:18px;}
  .row-label{font-size:12.5px; color:var(--text-hi);}

  /* ---------- FLOATING MOBILE TOOL DRAWER (small screens) ---------- */
  #statusPill{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:var(--panel); backdrop-filter:blur(18px);
    border:1px solid var(--panel-border); border-radius:20px;
    padding:6px 16px; font-size:11.5px; color:var(--text-lo);
    z-index:45; pointer-events:none; white-space:nowrap;
  }
  #statusPill b{color:var(--cyan); font-weight:600;}

  /* tooltip */
  .tool-btn[data-tip]::after{
    content:attr(data-tip);
    position:absolute; left:56px; top:50%; transform:translateY(-50%);
    background:#0b0f1c; border:1px solid var(--panel-border);
    padding:4px 9px; border-radius:6px; font-size:11px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .12s; z-index:100;
  }
  .tool-btn[data-tip]:hover::after{opacity:1;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12); border-radius:3px;}

  @media (max-width:720px){
    #propPanel{position:absolute; right:0; top:0; bottom:0; box-shadow:-10px 0 30px rgba(0,0,0,0.4);}
    .brand span.txt{display:none;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="brand"><span class="dot"></span><span class="txt">Math Smart Board</span></div>
    <div class="divider"></div>
    <button class="top-btn" id="btnUndo" data-tip="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="top-btn" id="btnRedo" data-tip="Redo (Ctrl+Y)">↷ Redo</button>
    <div class="divider"></div>
    <button class="top-btn" id="btnPrevPage">◀</button>
    <span id="pageLabel">Page 1 / 1</span>
    <button class="top-btn" id="btnNextPage">▶</button>
    <button class="top-btn" id="btnAddPage">+ Page</button>
    <div class="spacer"></div>
    <button class="top-btn" id="btnClear">🗑 Clear</button>
    <button class="top-btn" id="btnExport">⭳ Export PNG</button>
    <button class="top-btn primary" id="btnProps">⚙ Properties</button>
  </div>

  <div id="main">
    <div id="toolrail">
      <div class="tool-btn active" data-tool="pen" data-tip="Pen">✏️</div>
      <div class="tool-btn" data-tool="highlighter" data-tip="Highlighter">🖍️</div>
      <div class="tool-btn" data-tool="eraser" data-tip="Eraser">🧽</div>
      <div class="rail-sep"></div>
      <div class="tool-btn" data-tool="line" data-tip="Line">📏</div>
      <div class="tool-btn" data-tool="rect" data-tip="Rectangle">▭</div>
      <div class="tool-btn" data-tool="circle" data-tip="Circle">⚪</div>
      <div class="tool-btn" data-tool="triangle" data-tip="Triangle">▲</div>
      <div class="rail-sep"></div>
      <div class="tool-btn" data-tool="protractor" data-tip="Angle / Protractor">📐</div>
      <div class="tool-btn" data-tool="compass" data-tip="Compass (circle by radius)">🧭</div>
      <div class="tool-btn" data-tool="text" data-tip="Text / Equation">🔤</div>
      <div class="rail-sep"></div>
      <div class="tool-btn" data-tool="select" data-tip="Select / Move">🖱️</div>
      <div class="tool-btn" data-tool="pan" data-tip="Pan canvas">✋</div>
    </div>

    <div id="canvasWrap">
      <canvas id="bgCanvas"></canvas>
      <canvas id="mainCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <div id="statusPill">Tool: <b id="stTool">Pen</b> &nbsp;|&nbsp; Input: <b id="stInput">-</b> &nbsp;|&nbsp; Zoom: <b id="stZoom">100%</b></div>
    </div>

    <div id="propPanel">
      <div class="prop-group">
        <span class="prop-label">Stroke Color</span>
        <div class="swatches" id="colorSwatches"></div>
        <input type="color" id="customColor" style="margin-top:8px;" value="#22d3ee">
      </div>
      <div class="prop-group">
        <span class="prop-label">Stroke Width</span>
        <input type="range" id="sizeRange" min="1" max="40" value="4">
        <div class="size-preview"><div id="sizeDot"></div></div>
      </div>
      <div class="prop-group">
        <span class="prop-label">Background</span>
        <select id="bgSelect">
          <option value="blank">Blank</option>
          <option value="grid" selected>Grid</option>
          <option value="graph">Graph (Math)</option>
          <option value="dots">Dot Grid</option>
          <option value="ruled">Ruled Lines</option>
        </select>
      </div>
      <div class="prop-group">
        <div class="toggle-row">
          <span class="row-label">Pressure Sensitivity</span>
          <div class="switch on" id="togglePressure"></div>
        </div>
        <div class="toggle-row">
          <span class="row-label">Palm Rejection</span>
          <div class="switch on" id="togglePalm"></div>
        </div>
        <div class="toggle-row">
          <span class="row-label">Snap to Grid</span>
          <div class="switch" id="toggleSnap"></div>
        </div>
      </div>
      <div class="prop-group">
        <span class="prop-label">Zoom</span>
        <input type="range" id="zoomRange" min="50" max="300" value="100">
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ============================================================
     STATE
  ============================================================ */
  const state = {
    tool:'pen',
    color:'#22d3ee',
    size:4,
    pressureEnabled:true,
    palmRejection:true,
    snapToGrid:false,
    zoom:1,
    bgStyle:'grid',
    activePointerId:null,
    activePointerType:null,
    pages:[{ strokes:[], bg:'grid' }],
    pageIndex:0,
    undoStack:[],
    redoStack:[],
    panOffset:{x:0,y:0},
    isPanning:false,
    panStart:null
  };

  const PALETTE = ['#eef2ff','#22d3ee','#a78bfa','#fbbf24','#f87171','#34d399','#f472b6','#60a5fa'];

  /* ============================================================
     CANVAS SETUP
  ============================================================ */
  const bgCanvas = document.getElementById('bgCanvas');
  const mainCanvas = document.getElementById('mainCanvas');
  const overlayCanvas = document.getElementById('overlayCanvas');
  const wrap = document.getElementById('canvasWrap');

  const bgCtx = bgCanvas.getContext('2d');
  const mainCtx = mainCanvas.getContext('2d', { desynchronized:true });
  const overlayCtx = overlayCanvas.getContext('2d', { desynchronized:true });

  function resizeCanvases(){
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    [bgCanvas, mainCanvas, overlayCanvas].forEach(c=>{
      c.width = w * dpr;
      c.height = h * dpr;
      c.style.width = w + 'px';
      c.style.height = h + 'px';
    });
    bgCtx.setTransform(dpr,0,0,dpr,0,0);
    mainCtx.setTransform(dpr,0,0,dpr,0,0);
    overlayCtx.setTransform(dpr,0,0,dpr,0,0);
    drawBackground();
    redrawAll();
  }
  window.addEventListener('resize', resizeCanvases);

  /* ============================================================
     BACKGROUND RENDERING (grid / graph / dots / ruled)
  ============================================================ */
  function drawBackground(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    bgCtx.clearRect(0,0,w,h);
    bgCtx.fillStyle = '#0f1424';
    bgCtx.fillRect(0,0,w,h);
    const style = state.pages[state.pageIndex].bg;
    const gridSize = 32 * state.zoom;
    const lineColor = 'rgba(255,255,255,0.055)';
    const majorColor = 'rgba(34,211,238,0.10)';

    if(style === 'blank') return;

    if(style === 'dots'){
      bgCtx.fillStyle = 'rgba(255,255,255,0.14)';
      for(let x = state.panOffset.x % gridSize; x < w; x += gridSize){
        for(let y = state.panOffset.y % gridSize; y < h; y += gridSize){
          bgCtx.beginPath();
          bgCtx.arc(x,y,1.4,0,Math.PI*2);
          bgCtx.fill();
        }
      }
      return;
    }

    if(style === 'ruled'){
      bgCtx.strokeStyle = lineColor;
      bgCtx.lineWidth = 1;
      for(let y = state.panOffset.y % (gridSize*1.3); y < h; y += gridSize*1.3){
        bgCtx.beginPath(); bgCtx.moveTo(0,y); bgCtx.lineTo(w,y); bgCtx.stroke();
      }
      return;
    }

    // grid + graph share the base grid
    bgCtx.strokeStyle = lineColor;
    bgCtx.lineWidth = 1;
    for(let x = state.panOffset.x % gridSize; x < w; x += gridSize){
      bgCtx.beginPath(); bgCtx.moveTo(x,0); bgCtx.lineTo(x,h); bgCtx.stroke();
    }
    for(let y = state.panOffset.y % gridSize; y < h; y += gridSize){
      bgCtx.beginPath(); bgCtx.moveTo(0,y); bgCtx.lineTo(w,y); bgCtx.stroke();
    }

    if(style === 'graph'){
      // bold axes through center + glow
      const cx = w/2 + state.panOffset.x % gridSize - Math.floor((w/2)/gridSize)*0 ;
      const originX = (w/2) + (state.panOffset.x % gridSize);
      const originY = (h/2) + (state.panOffset.y % gridSize);
      bgCtx.strokeStyle = majorColor;
      bgCtx.lineWidth = 1.6;
      bgCtx.beginPath(); bgCtx.moveTo(0,h/2); bgCtx.lineTo(w,h/2); bgCtx.stroke();
      bgCtx.beginPath(); bgCtx.moveTo(w/2,0); bgCtx.lineTo(w/2,h); bgCtx.stroke();
      // major gridlines every 5 cells
      bgCtx.strokeStyle = 'rgba(167,139,250,0.10)';
      const majorSize = gridSize*5;
      for(let x = state.panOffset.x % majorSize; x < w; x += majorSize){
        bgCtx.beginPath(); bgCtx.moveTo(x,0); bgCtx.lineTo(x,h); bgCtx.stroke();
      }
      for(let y = state.panOffset.y % majorSize; y < h; y += majorSize){
        bgCtx.beginPath(); bgCtx.moveTo(0,y); bgCtx.lineTo(w,y); bgCtx.stroke();
      }
    }
  }

  /* ============================================================
     STROKE MODEL + COMMAND STACK (memory-safe undo/redo)
  ============================================================ */
  function currentPage(){ return state.pages[state.pageIndex]; }

  function pushUndo(action){
    state.undoStack.push(action);
    if(state.undoStack.length > 200) state.undoStack.shift();
    state.redoStack.length = 0;
    updateUndoRedoButtons();
  }

  function undo(){
    const action = state.undoStack.pop();
    if(!action) return;
    if(action.type === 'add'){
      const page = state.pages[action.pageIndex];
      const idx = page.strokes.indexOf(action.stroke);
      if(idx > -1) page.strokes.splice(idx,1);
    } else if(action.type === 'clear'){
      state.pages[action.pageIndex].strokes = action.prevStrokes;
    }
    state.redoStack.push(action);
    redrawAll();
    updateUndoRedoButtons();
  }

  function redo(){
    const action = state.redoStack.pop();
    if(!action) return;
    if(action.type === 'add'){
      state.pages[action.pageIndex].strokes.push(action.stroke);
    } else if(action.type === 'clear'){
      state.pages[action.pageIndex].strokes = [];
    }
    state.undoStack.push(action);
    redrawAll();
    updateUndoRedoButtons();
  }

  function updateUndoRedoButtons(){
    document.getElementById('btnUndo').disabled = state.undoStack.length === 0;
    document.getElementById('btnRedo').disabled = state.redoStack.length === 0;
  }

  /* ============================================================
     RENDER LOOP — decoupled from input via rAF
  ============================================================ */
  let needsRedraw = false;
  function scheduleRedraw(){ needsRedraw = true; }
  function renderLoop(){
    if(needsRedraw){
      redrawAll();
      needsRedraw = false;
    }
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  function redrawAll(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    mainCtx.clearRect(0,0,w,h);
    mainCtx.save();
    mainCtx.translate(state.panOffset.x, state.panOffset.y);
    mainCtx.scale(state.zoom, state.zoom);
    currentPage().strokes.forEach(drawStroke);
    mainCtx.restore();
  }

  function drawStroke(stroke, targetCtx){
    const ctx = targetCtx || mainCtx;
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if(stroke.tool === 'highlighter'){
      ctx.globalAlpha = 0.35;
      ctx.globalCompositeOperation = 'lighter';
    } else if(stroke.tool === 'eraser'){
      ctx.globalCompositeOperation = 'destination-out';
    } else {
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.strokeStyle = stroke.color;
    ctx.fillStyle = stroke.color;

    if(stroke.shape === 'freehand'){
      const pts = stroke.points;
      if(pts.length < 2){
        if(pts.length===1){
          ctx.beginPath();
          ctx.arc(pts[0].x, pts[0].y, (stroke.baseWidth||stroke.width)/2, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.restore(); return;
      }
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i=1;i<pts.length-1;i++){
        const midX = (pts[i].x + pts[i+1].x)/2;
        const midY = (pts[i].y + pts[i+1].y)/2;
        ctx.lineWidth = pts[i].w || stroke.width;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
      }
      ctx.stroke();
    } else if(stroke.shape === 'line'){
      ctx.lineWidth = stroke.width;
      ctx.beginPath();
      ctx.moveTo(stroke.x1, stroke.y1);
      ctx.lineTo(stroke.x2, stroke.y2);
      ctx.stroke();
    } else if(stroke.shape === 'rect'){
      ctx.lineWidth = stroke.width;
      ctx.strokeRect(Math.min(stroke.x1,stroke.x2), Math.min(stroke.y1,stroke.y2),
        Math.abs(stroke.x2-stroke.x1), Math.abs(stroke.y2-stroke.y1));
    } else if(stroke.shape === 'circle'){
      ctx.lineWidth = stroke.width;
      const r = Math.hypot(stroke.x2-stroke.x1, stroke.y2-stroke.y1);
      ctx.beginPath();
      ctx.arc(stroke.x1, stroke.y1, r, 0, Math.PI*2);
      ctx.stroke();
    } else if(stroke.shape === 'triangle'){
      ctx.lineWidth = stroke.width;
      const midX = (stroke.x1+stroke.x2)/2;
      ctx.beginPath();
      ctx.moveTo(midX, stroke.y1);
      ctx.lineTo(stroke.x1, stroke.y2);
      ctx.lineTo(stroke.x2, stroke.y2);
      ctx.closePath();
      ctx.stroke();
    } else if(stroke.shape === 'protractor'){
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(stroke.x1, stroke.y1, 70, 0, Math.PI, true);
      ctx.stroke();
      const a1 = Math.atan2(stroke.y1-stroke.y1, stroke.x2-stroke.x1);
      ctx.beginPath(); ctx.moveTo(stroke.x1,stroke.y1); ctx.lineTo(stroke.x1-70,stroke.y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(stroke.x1,stroke.y1); ctx.lineTo(stroke.x2,stroke.y2); ctx.stroke();
      const angle = getAngleDeg(stroke.x1,stroke.y1,stroke.x2,stroke.y2);
      ctx.font = '13px Segoe UI';
      ctx.fillText(angle.toFixed(1)+'°', stroke.x1+10, stroke.y1-40);
    } else if(stroke.shape === 'compass'){
      ctx.lineWidth = stroke.width;
      const r = Math.hypot(stroke.x2-stroke.x1, stroke.y2-stroke.y1);
      ctx.beginPath();
      ctx.arc(stroke.x1, stroke.y1, r, 0, Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(stroke.x1, stroke.y1, 2.5, 0, Math.PI*2);
      ctx.fill();
      ctx.font='12px Segoe UI';
      ctx.fillText('r='+r.toFixed(0), stroke.x1+r*0.3, stroke.y1-8);
    } else if(stroke.shape === 'text'){
      ctx.font = (stroke.width*5+14)+'px Segoe UI';
      ctx.fillText(stroke.text, stroke.x1, stroke.y1);
    }
    ctx.restore();
  }

  function getAngleDeg(cx,cy,x2,y2){
    const v1 = {x:-70, y:0};
    const v2 = {x:x2-cx, y:y2-cy};
    const dot = v1.x*v2.x + v1.y*v2.y;
    const mag = Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y) || 1;
    let ang = Math.acos(Math.max(-1,Math.min(1,dot/mag))) * 180/Math.PI;
    return ang;
  }

  /* ============================================================
     UNIFIED POINTER INPUT (mouse + pen + touch)
     - Pointer Events API
     - getCoalescedEvents() for high-fidelity pen/mouse capture
     - Pressure-aware width
     - Palm rejection when a pen is in use
  ============================================================ */
  let currentStroke = null;
  let pendingPoints = [];
  let shapeStart = null;

  function toCanvasCoords(e){
    const rect = mainCanvas.getBoundingClientRect();
    const x = (e.clientX - rect.left - state.panOffset.x) / state.zoom;
    const y = (e.clientY - rect.top - state.panOffset.y) / state.zoom;
    return {x,y};
  }

  function widthFromPressure(e){
    if(!state.pressureEnabled) return state.size;
    let p = e.pressure;
    if(p === undefined || p === 0) p = 0.5; // mouse / no-pressure devices
    return Math.max(1, state.size * (0.4 + p*1.2));
  }

  overlayCanvas.style.pointerEvents = 'auto';
  mainCanvas.style.pointerEvents = 'none';
  bgCanvas.style.pointerEvents = 'none';

  overlayCanvas.addEventListener('pointerdown', onPointerDown);
  overlayCanvas.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  function onPointerDown(e){
    // Palm rejection: ignore touch input if a pen was active recently
    if(state.palmRejection && e.pointerType === 'touch' && state.lastPenTime && (Date.now()-state.lastPenTime < 800)){
      return;
    }
    if(e.pointerType === 'pen') state.lastPenTime = Date.now();
    if(state.activePointerId !== null) return; // ignore multi-touch for drawing
    state.activePointerId = e.pointerId;
    state.activePointerType = e.pointerType;
    document.getElementById('stInput').textContent = e.pointerType;
    overlayCanvas.setPointerCapture(e.pointerId);

    const pt = toCanvasCoords(e);

    if(state.tool === 'pan' || (e.pointerType==='touch' && state.tool==='pan')){
      state.isPanning = true;
      state.panStart = {x:e.clientX - state.panOffset.x, y:e.clientY - state.panOffset.y};
      return;
    }

    if(['pen','highlighter','eraser'].includes(state.tool)){
      currentStroke = {
        tool: state.tool,
        shape:'freehand',
        color: state.tool==='eraser' ? '#000000' : state.color,
        width: widthFromPressure(e),
        baseWidth: state.size,
        points:[{x:pt.x,y:pt.y,w:widthFromPressure(e)}]
      };
    } else if(['line','rect','circle','triangle','protractor','compass'].includes(state.tool)){
      shapeStart = pt;
    } else if(state.tool === 'text'){
      const txt = prompt('Enter text / equation:');
      if(txt){
        const stroke = {tool:'pen', shape:'text', color:state.color, width:state.size, x1:pt.x, y1:pt.y, text:txt};
        currentPage().strokes.push(stroke);
        pushUndo({type:'add', pageIndex:state.pageIndex, stroke});
        scheduleRedraw();
      }
      state.activePointerId = null;
    }
  }

  function onPointerMove(e){
    if(e.pointerId !== state.activePointerId) return;

    if(state.isPanning && state.panStart){
      state.panOffset.x = e.clientX - state.panStart.x;
      state.panOffset.y = e.clientY - state.panStart.y;
      drawBackground();
      scheduleRedraw();
      return;
    }

    const events = (e.getCoalescedEvents && e.getCoalescedEvents()) || [e];

    if(currentStroke){
      events.forEach(ev=>{
        const pt = toCanvasCoords(ev);
        currentStroke.points.push({x:pt.x, y:pt.y, w:widthFromPressure(ev)});
      });
      renderLivePreview();
    } else if(shapeStart){
      const pt = toCanvasCoords(e);
      overlayCtx.clearRect(0,0,wrap.clientWidth,wrap.clientHeight);
      overlayCtx.save();
      overlayCtx.translate(state.panOffset.x, state.panOffset.y);
      overlayCtx.scale(state.zoom, state.zoom);
      overlayCtx.strokeStyle = state.color;
      overlayCtx.lineWidth = state.size;
      overlayCtx.setLineDash([6,4]);
      previewShape(overlayCtx, state.tool, shapeStart, pt);
      overlayCtx.restore();
    }
  }

  function previewShape(ctx, tool, p1, p2){
    ctx.beginPath();
    if(tool==='line'){ ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
    else if(tool==='rect'){ ctx.strokeRect(Math.min(p1.x,p2.x),Math.min(p1.y,p2.y),Math.abs(p2.x-p1.x),Math.abs(p2.y-p1.y)); }
    else if(tool==='circle' || tool==='compass'){
      const r = Math.hypot(p2.x-p1.x, p2.y-p1.y);
      ctx.arc(p1.x,p1.y,r,0,Math.PI*2); ctx.stroke();
    }
    else if(tool==='triangle'){
      const midX=(p1.x+p2.x)/2;
      ctx.moveTo(midX,p1.y); ctx.lineTo(p1.x,p2.y); ctx.lineTo(p2.x,p2.y); ctx.closePath(); ctx.stroke();
    }
    else if(tool==='protractor'){
      ctx.arc(p1.x,p1.y,70,0,Math.PI,true); ctx.stroke();
      ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    }
  }

  function renderLivePreview(){
    overlayCtx.clearRect(0,0,wrap.clientWidth,wrap.clientHeight);
    overlayCtx.save();
    overlayCtx.translate(state.panOffset.x, state.panOffset.y);
    overlayCtx.scale(state.zoom, state.zoom);
    drawStroke(currentStroke, overlayCtx); // draw live stroke on overlay for zero-lag feedback
    overlayCtx.restore();
  }

  function onPointerUp(e){
    if(e.pointerId !== state.activePointerId) return;

    if(state.isPanning){
      state.isPanning = false;
      state.panStart = null;
      state.activePointerId = null;
      return;
    }

    overlayCtx.clearRect(0,0,wrap.clientWidth,wrap.clientHeight);

    if(currentStroke){
      if(currentStroke.points.length === 1){
        currentStroke.points.push({...currentStroke.points[0]});
      }
      currentPage().strokes.push(currentStroke);
      pushUndo({type:'add', pageIndex:state.pageIndex, stroke:currentStroke});
      currentStroke = null;
      scheduleRedraw();
    } else if(shapeStart){
      const pt = toCanvasCoords(e);
      const shapeMap = {line:'line', rect:'rect', circle:'circle', triangle:'triangle', protractor:'protractor', compass:'compass'};
      const stroke = {
        tool:'pen', shape:shapeMap[state.tool], color:state.color, width:state.size,
        x1:shapeStart.x, y1:shapeStart.y, x2:pt.x, y2:pt.y
      };
      currentPage().strokes.push(stroke);
      pushUndo({type:'add', pageIndex:state.pageIndex, stroke});
      shapeStart = null;
      scheduleRedraw();
    }
    state.activePointerId = null;
  }

  /* ============================================================
     TOOLBAR / TOOL SELECTION
  ============================================================ */
  document.querySelectorAll('.tool-btn[data-tool]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tool-btn[data-tool]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.tool = btn.dataset.tool;
      document.getElementById('stTool').textContent = btn.dataset.tip;
      overlayCanvas.style.cursor = (state.tool==='pan') ? 'grab' : 'crosshair';
    });
  });

  /* ============================================================
     COLOR SWATCHES
  ============================================================ */
  const swatchWrap = document.getElementById('colorSwatches');
  PALETTE.forEach((c,i)=>{
    const el = document.createElement('div');
    el.className = 'swatch' + (i===1 ? ' active':'');
    el.style.background = c;
    el.addEventListener('click', ()=>{
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      el.classList.add('active');
      state.color = c;
      document.getElementById('customColor').value = c;
    });
    swatchWrap.appendChild(el);
  });
  document.getElementById('customColor').addEventListener('input', (e)=>{
    state.color = e.target.value;
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  });

  /* ============================================================
     SIZE / ZOOM / BACKGROUND CONTROLS
  ============================================================ */
  const sizeRange = document.getElementById('sizeRange');
  const sizeDot = document.getElementById('sizeDot');
  function updateSizeDot(){
    const d = Math.max(4, Math.min(36, state.size));
    sizeDot.style.width = d+'px';
    sizeDot.style.height = d+'px';
  }
  sizeRange.addEventListener('input', e=>{ state.size = +e.target.value; updateSizeDot(); });
  updateSizeDot();

  document.getElementById('zoomRange').addEventListener('input', e=>{
    state.zoom = +e.target.value/100;
    document.getElementById('stZoom').textContent = e.target.value+'%';
    drawBackground();
    scheduleRedraw();
  });

  document.getElementById('bgSelect').addEventListener('change', e=>{
    currentPage().bg = e.target.value;
    drawBackground();
  });

  function bindSwitch(id, key){
    const el = document.getElementById(id);
    el.addEventListener('click', ()=>{
      state[key] = !state[key];
      el.classList.toggle('on', state[key]);
    });
  }
  bindSwitch('togglePressure','pressureEnabled');
  bindSwitch('togglePalm','palmRejection');
  bindSwitch('toggleSnap','snapToGrid');

  document.getElementById('btnProps').addEventListener('click', ()=>{
    document.getElementById('propPanel').classList.toggle('collapsed');
  });

  /* ============================================================
     UNDO / REDO / CLEAR / EXPORT / PAGES
  ============================================================ */
  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnRedo').addEventListener('click', redo);

  document.getElementById('btnClear').addEventListener('click', ()=>{
    if(currentPage().strokes.length===0) return;
    const prevStrokes = currentPage().strokes;
    pushUndo({type:'clear', pageIndex:state.pageIndex, prevStrokes});
    currentPage().strokes = [];
    scheduleRedraw();
  });

  document.getElementById('btnExport').addEventListener('click', ()=>{
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(bgCanvas, 0,0,w,h);
    tctx.drawImage(mainCanvas, 0,0,w,h);
    const link = document.createElement('a');
    link.download = 'math-board-page-'+(state.pageIndex+1)+'.png';
    link.href = tmp.toDataURL('image/png');
    link.click();
  });

  function updatePageLabel(){
    document.getElementById('pageLabel').textContent = `Page ${state.pageIndex+1} / ${state.pages.length}`;
  }
  document.getElementById('btnAddPage').addEventListener('click', ()=>{
    state.pages.push({strokes:[], bg: currentPage().bg});
    state.pageIndex = state.pages.length-1;
    document.getElementById('bgSelect').value = currentPage().bg;
    updatePageLabel();
    drawBackground();
    scheduleRedraw();
    state.undoStack.length = 0; state.redoStack.length = 0;
    updateUndoRedoButtons();
  });
  document.getElementById('btnPrevPage').addEventListener('click', ()=>{
    if(state.pageIndex>0){
      state.pageIndex--;
      document.getElementById('bgSelect').value = currentPage().bg;
      updatePageLabel(); drawBackground(); scheduleRedraw();
    }
  });
  document.getElementById('btnNextPage').addEventListener('click', ()=>{
    if(state.pageIndex < state.pages.length-1){
      state.pageIndex++;
      document.getElementById('bgSelect').value = currentPage().bg;
      updatePageLabel(); drawBackground(); scheduleRedraw();
    }
  });

  /* ============================================================
     KEYBOARD SHORTCUTS
  ============================================================ */
  window.addEventListener('keydown', e=>{
    if(e.ctrlKey && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
    if(e.ctrlKey && (e.key.toLowerCase()==='y' || (e.shiftKey && e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); }
  });

  /* ============================================================
     INIT
  ============================================================ */
  resizeCanvases();
  updatePageLabel();
  updateUndoRedoButtons();

})();
</script>
</body>
</html>
